kind = "web"
previewPath = "/"
title = "ZXKAI I — Portfolio"
description = "A bold, responsive creator portfolio for ZXKAI I, showcasing available apps, upcoming releases, and community links."
version = "1.0.0"
id = "artifacts/zxkai-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18548

[services.development]
run = "pnpm --filter @workspace/zxkai-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zxkai-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/zxkai-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18548"
BASE_PATH = "/"
